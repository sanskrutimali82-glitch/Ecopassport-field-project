<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#218653">
<meta name="description" content="EcoPassport pollution footprint diary and eco-friendly activity tracker">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="settings"><div id="root"></div><script src="js/app.js"></script><script>
document.getElementById('root').innerHTML=shell('Settings','Profile & settings','Manage your profile, preferences and EcoPassport data.',`
<div class="grid two"><div class="card"><div class="card-head"><h2>Profile information</h2><div class="profile-large" data-avatar>E</div></div><form id="profileForm"><div class="form-grid"><div class="field full"><label>Display name</label><input name="name" required maxlength="60"></div><div class="field full"><label>Email address</label><input name="email" type="email" placeholder="you@example.com"></div><div class="field full"><label>City</label><input name="city" placeholder="Your city"></div></div><div class="form-actions"><button class="btn" type="submit">Save profile</button></div></form></div><div class="card"><h2>Appearance</h2><p class="muted">Switch between light and dark mode using the moon icon in the top bar. Your choice is saved in this browser.</p><div class="tip"><span class="tip-icon">🌞</span><div><b>Light mode</b><p>Bright, clean workspace for daytime.</p></div></div><div class="tip"><span class="tip-icon">🌙</span><div><b>Dark mode</b><p>Low-light theme with green accents.</p></div></div><button class="btn secondary" id="themeToggleSettings" onclick="document.getElementById('themeToggle').click()">Toggle appearance</button></div></div>
<div class="card" style="margin-top:16px"><h2>Footprint calculation factors</h2><p class="muted">Editable demonstration assumptions, not official or location-specific emission factors.</p><form id="factorForm"><div class="form-grid"><div class="field"><label>Transport factor (kg CO₂e / km)</label><input name="transportFactor" type="number" min="0" step=".001" required></div><div class="field"><label>Electricity factor (kg CO₂e / kWh)</label><input name="electricityFactor" type="number" min="0" step=".001" required></div><div class="field"><label>Plastic factor (kg CO₂e / item)</label><input name="plasticFactor" type="number" min="0" step=".001" required></div><div class="field"><label>AC factor (kg CO₂e / hour)</label><input name="acFactor" type="number" min="0" step=".001" required></div></div><div class="form-actions"><button class="btn" type="submit">Save calculation factors</button></div></form></div>
<div class="card" style="margin-top:16px"><h2>Data management</h2><p class="muted">Your records are stored locally in this browser. Export a backup before clearing browser data or changing devices.</p><div class="actions"><button class="btn" id="exportBtn">↓ Export diary CSV</button><button class="btn secondary" id="backupBtn">↓ Backup all data (JSON)</button><label class="btn outline" for="restoreFile">↑ Restore backup</label><input id="restoreFile" type="file" accept=".json,application/json" hidden><button class="btn danger" id="resetBtn">Reset all data</button></div></div>`);</script></body>
</html>
