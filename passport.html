<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#218653">
<meta name="description" content="EcoPassport pollution footprint diary and eco-friendly activity tracker">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="passport"><div id="root"></div><script src="js/app.js"></script><script>
document.getElementById('root').innerHTML=shell('Digital EcoPassport','Your Digital EcoPassport','Keep a record of your positive contributions to the environment.',`
<div class="grid two"><div class="card"><h2>Record an eco-friendly activity</h2><form id="activityForm"><div class="form-grid"><div class="field"><label>Activity date</label><input name="date" type="date" required></div><div class="field"><label>Activity type</label><select name="type" required><option value="">Choose activity</option><option>Tree plantation</option><option>Recycling</option><option>Volunteer work</option><option>Pollution report</option><option>Carbon savings</option></select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" value="1" required></div><div class="field"><label>Description</label><input name="description" placeholder="e.g. Planted trees at college"></div></div><div class="form-actions"><button class="btn" type="submit">＋ Add activity</button></div></form></div><div class="card"><div class="eyebrow">YOUR CONTRIBUTION</div><h2 style="margin-top:6px">Positive impact so far</h2><div class="stat-value" id="activityPoints">0 points</div><p class="muted">Eco points are awarded for activities recorded in your passport.</p><div class="grid two"><div><div class="stat-value" id="treeCount">0</div><span class="muted">Trees planted 🌳</span></div><div><div class="stat-value" id="activityCount">★</div><span class="muted">Keep going!</span></div></div><a href="progress.html" class="btn secondary" style="margin-top:16px">See your badges →</a></div></div>
<div class="card" style="margin-top:16px"><div class="card-head"><h2>My activity history</h2><span class="pill">EcoPassport records</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Activity</th><th>Description</th><th>Quantity</th><th>Points</th><th>Action</th></tr></thead><tbody id="activityTable"></tbody></table></div></div>`);</script></body>
</html>
